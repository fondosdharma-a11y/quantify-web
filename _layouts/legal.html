<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Quantify" }} — Quantify</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0D;--surface:#16161A;--line:#2A2A30;--gold:#C9A227;--ivory:#F2F0EA;--muted:#8B877E;--dim:#7E7972}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--ivory);font-family:'Archivo',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,13,.85);backdrop-filter:blur(12px);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2rem)}
.nav .wrap{display:flex;align-items:center;height:62px}
.brand{display:flex;align-items:center;gap:.55rem;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:var(--ivory);text-decoration:none;letter-spacing:-.02em}
main{padding:clamp(2.5rem,6vw,4rem) 0 clamp(3rem,7vw,5rem)}
main h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,4.5vw,2.5rem);letter-spacing:-.03em;line-height:1.15;margin-bottom:1.75rem}
main h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.15rem,2.6vw,1.35rem);font-weight:500;letter-spacing:-.015em;margin:2.5rem 0 .85rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--gold)}
main h1+p{color:var(--muted);font-size:.9rem}
main p{margin-bottom:1rem;color:#D8D4CB}
main ul{margin:0 0 1.25rem 1.25rem;color:#D8D4CB}
main li{margin-bottom:.5rem}
main strong{color:var(--ivory);font-weight:600}
main hr{border:0;border-top:1px solid var(--line);margin:3rem 0}
main code{font-family:ui-monospace,monospace;background:var(--surface);padding:.15em .4em;border-radius:4px;font-size:.9em}
footer{border-top:1px solid var(--line);padding:2rem 0;font-size:.85rem;color:var(--dim)}
footer a{color:var(--muted);text-decoration:none;margin-right:1.25rem}
footer a:hover{color:var(--ivory);text-decoration:underline}
</style>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="/">
    <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="49" cy="46" r="28" fill="none" stroke="#F2F0EA" stroke-width="8.5"/>
      <rect x="30" y="46" width="5" height="7" rx="1" fill="#8C7020"/>
      <rect x="38" y="41" width="5" height="12" rx="1" fill="#8C7020"/>
      <rect x="46" y="35" width="5" height="18" rx="1" fill="#C9A227"/>
      <line x1="57" y1="54" x2="74" y2="71" stroke="#C9A227" stroke-width="10"/>
    </svg>
    Quantify
  </a>
</div></nav>
<main><div class="wrap">{{ content }}</div></main>
<footer><div class="wrap">
  <a href="/">Inicio</a><a href="/privacidad">Privacidad</a><a href="/terminos">Términos</a>
  <p style="margin-top:1rem">© 2026 Fondos Dharma</p>
</div></footer>
</body>
</html>
